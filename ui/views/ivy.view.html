<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Telescope - Ivy Layout</title>
  <cssvariables></cssvariables>
  <link rel="stylesheet" href="{{style}}">
  <link rel="stylesheet" href="{{highlight-styles}}">
  <link rel="stylesheet" href="{{branch-styles}}">
  <link rel="stylesheet" href="{{font-styles}}">
  <link rel="stylesheet" href="{{vim-styles}}">
  <base href="{{dist-uri}}/">`
  <script>
    const __PREVIEW_CFG__ = JSON.parse('{{__PREVIEW_CFG__}}');
    const __KEYBINDINGS_CFG__ = JSON.parse('{{__KEYBINDINGS_CFG__}}');
    const __CUSTOM_RENDER_ADAPTERS__ = JSON.parse('{{__CUSTOM_RENDER_ADAPTERS__}}');
    const __MATCHING_CFG__ = JSON.parse('{{__MATCHING_CFG__}}');
    const __FILE_PATH_DISPLAY__ = '{{__WS_PATH_DISPLAY__}}';
    const __PROVIDER__ = '{{__PROVIDER__}}'
    // Your editor may show a JavaScript syntax error here — that's expected.
    // This placeholder is intentionally left unquoted so the final template can
    // correctly preserve and escape both single and double quotes.
    const __INITIAL_QUERY__ = {{__INITIAL_QUERY__}};
  </script>
  <script id="__CUSTOM_DATA_ADAPTER__" type="text/plain">
    {{__CUSTOM_DATA_ADAPTER__}}
  </script>
  <script defer src="{{script}}"></script>
</head>

<body data-layout="ivy">
  <div id="container">
    <div id="horizontal-resizer"></div>
    <div id="input-container">
      <input id="search" type="text" autofocus>
      <span id="items-count">0 / 0</span>
    </div>
    <div id="split">
      <div id="search-results">
        <ul id="option-list"></ul>
      </div>
      <div id="vertical-resizer"></div>
      <div id="preview-side">
        <div id="preview"></div>
      </div>
    </div>
  </div>
</body>

</html>
