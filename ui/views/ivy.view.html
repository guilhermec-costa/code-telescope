<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="Content-Security-Policy" content="{{__CSP__}}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Telescope - Ivy Layout</title>
  <cssvariables></cssvariables>
  <link rel="stylesheet" href="{{style}}">
  <link rel="stylesheet" href="{{highlight-styles}}">
  <link rel="stylesheet" href="{{branch-styles}}">
  <link rel="stylesheet" href="{{font-styles}}">
  <link rel="stylesheet" href="{{vim-styles}}">
  <base href="{{dist-uri}}/">
  <script nonce="{{__NONCE__}}">
    // Template placeholders are replaced at runtime by WebviewAssetManager.
    // Editor parse errors here are expected.
    const __PREVIEW_CFG__ = {{__PREVIEW_CFG__}};
    const __KEYBINDINGS_CFG__ = {{__KEYBINDINGS_CFG__}};
    const __CUSTOM_RENDER_ADAPTERS__ = {{__CUSTOM_RENDER_ADAPTERS__}};
    const __MATCHING_CFG__ = {{__MATCHING_CFG__}};
    const __FILE_PATH_DISPLAY__ = {{__FILE_PATH_DISPLAY__}};
    const __PROVIDER__ = {{__PROVIDER__}};
    const __INITIAL_QUERY__ = {{__INITIAL_QUERY__}};
    const __INITIAL_SELECTED_VALUE__ = {{__INITIAL_SELECTED_VALUE__}};
  </script>
  <script nonce="{{__NONCE__}}" id="__CUSTOM_DATA_ADAPTER__" type="text/plain">
    {{__CUSTOM_DATA_ADAPTER__}}
  </script>
  <script nonce="{{__NONCE__}}" defer src="{{script}}"></script>
</head>

<body data-layout="ivy">
  <div id="container">
    <div id="horizontal-resizer"></div>
    <div id="input-container">
      <input id="search" type="text">
      <span id="items-count">0 / 0</span>
    </div>
    <div id="split">
      <div id="search-results">
        <ul id="option-list"></ul>
      </div>
      <div id="vertical-resizer"></div>
      <div id="preview-side">
        <div id="preview"></div>
      </div>
    </div>
  </div>
</body>

</html>
